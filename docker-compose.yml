version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowboard
      POSTGRES_PASSWORD: flowboard
      POSTGRES_DB: flowboard
    ports:
      - '5432:5432'
    volumes:
      - flowboard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowboard']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://flowboard:flowboard@postgres:5432/flowboard
      JWT_SECRET: local-dev-secret-change-me-please-32chars-min
      JWT_EXPIRES_IN: 7d
      EMAIL_PROVIDER: console
      CORS_ORIGINS: http://localhost:3000
    ports:
      - '3000:3000'

volumes:
  flowboard_pg_data:
